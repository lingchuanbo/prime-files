[package]
name = "nohrs-indexer"
description = "The Windows service that reads NTFS master file tables for Prime Files' whole-computer search, and the app's side of talking to it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

# A program of its own, not a mode of PrimeFiles.exe: it runs as SYSTEM, so
# it carries nothing it does not need (no UI, no network), and it lives in
# Program Files, where only an administrator can replace it, while the app
# updates itself in the user's folder.
[lib]
name = "nohrs_indexer"
path = "src/nohrs_indexer.rs"

[[bin]]
name = "prime-files-indexer"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
