[package]
name = "nohrs-cli"
description = "Command-line companion for nohrs: file operations that default to the trash."
keywords = ["cli", "rm", "trash", "filesystem", "undo"]
categories = ["command-line-utilities", "filesystem"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "nohrs_cli"
path = "src/nohrs_cli.rs"

[[bin]]
# The crate keeps the `nohrs-*` family name; the command itself is short
# because it is typed constantly.
name = "noh"
path = "src/main.rs"

[dependencies]
nohrs-core = { path = "../nohrs-core" }
# The `gui` feature is deliberately off: the CLI needs only `fs`, so it builds
# without any UI toolkit (it is part of `default-members`).
nohrs-services = { path = "../nohrs-services" }
nohrs-store = { path = "../nohrs-store" }
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
dirs = "6"

[target.'cfg(windows)'.dependencies]
# `noh quick-launch run` has to enter a COM apartment itself before handing an
# item to the Shell: the CLI cannot depend on `nohrs-pages` (which owns the
# existing apartment code) and `nohrs-services` exposes no way to enter one.
# Pinned to the version the rest of the workspace links.
windows = { version = "0.61", features = ["Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
