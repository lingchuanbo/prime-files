[package]
name = "nohrs-pages"
description = "Page views (explorer, settings, git, s3) for the nohrs app."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "nohrs_pages"
path = "src/nohrs_pages.rs"

[dependencies]
nohrs-core     = { path = "../nohrs-core" }
nohrs-models   = { path = "../nohrs-models" }
nohrs-services = { path = "../nohrs-services", features = ["gui"] }
nohrs-store    = { path = "../nohrs-store" }
nohrs-ui       = { path = "../nohrs-ui" }
gpui = "0.2"
gpui-component = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
anyhow.workspace     = true
serde.workspace      = true
# The terminal panel: ConPTY plus the grid and escape-sequence parser.
alacritty_terminal = "0.26"
# preserve_order: Listary's Preferences.json is rewritten in its own key order.
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace    = true
# `local-offset`: "Today" and "Yesterday" in Group by are local days.
time = { workspace = true, features = ["local-offset"] }
notify = "8"
# The profile folder for a new tab: Windows has no `HOME`.
dirs = "6"
# Hands a finished thumbnail from a worker thread back to the pane's task.
async-channel = "2"
# Reads the Explorer window's HWND for the IPC endpoint; the version gpui uses.
raw-window-handle = "0.6"
# The updater: comparing release versions and checking the downloaded
# installer against SHA256SUMS.txt. Both already in the tree.
semver = "1"
sha2 = "0.10"

# Thumbnails come from the Shell's own extractor (`IShellItemImageFactory`), the
# one Explorer uses: it covers images, video frames, PDFs and program icons in one
# call and reads the system thumbnail cache. Pinned to the version gpui already
# links so no second copy of the bindings enters the tree.
[target.'cfg(windows)'.dependencies]
# The indexer service's protocol and client (instant indexing).
nohrs-indexer = { path = "../nohrs-indexer" }
windows = { version = "0.61", features = [
  "Data_Pdf",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation",
  "Win32_NetworkManagement_WNet",
  "Win32_Storage_FileSystem",
  "Win32_Storage_IndexServer",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` expands to `::windows_core::…`, so the crate has to be a direct
# dependency, at the version `windows` 0.61 itself uses (another copy is in the
# tree, and its `IUnknownImpl` does not satisfy 0.61's interfaces).
windows-core = "0.61"

# Lists a .zip's entries in the preview pane. Built without codecs: the one
# part that is decompressed (a document's XML) is inflated with flate2, which
# also reads Premiere's gzipped projects.
zip = { version = "2", default-features = false }
flate2 = "1"

# 3D models in the preview pane, one reader per format. glTF without its
# image decoding: the preview draws flat colours, never textures.
tobj = "4"
stl_io = "0.8"
gltf = { version = "1", default-features = false, features = ["import", "utils"] }
# FBX (binary, 7.x): read as a node tree; geometry and model transforms are
# taken from it by hand, as the DOM crates on top of it are unmaintained.
fbxcel = { version = "0.9", features = ["tree"] }

[dev-dependencies]
# `test-support` gates `TestAppContext` and the `#[gpui::test]` macro. It is a
# dev-dependency so the gpui test backend only links into the test build.
gpui = { version = "0.2", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
