[workspace]
resolver = "2"
members = [
  "crates/nohrs",
  "crates/nohrs-cli",
  "crates/nohrs-core",
  "crates/nohrs-models",
  "crates/nohrs-services",
  "crates/nohrs-store",
  "crates/nohrs-ui",
  "crates/nohrs-pages",
  "crates/nohrs-launcher",
  "crates/nohrs-indexer",
]
# P4 以降に追加:
#   "crates/nohrs-plugin-host",
#   "crates/plugins/*"
exclude = ["web", "third_party/gpui"]

# gpui renders with Metal/Blade and the GUI stack is only exercised on macOS, so
# Linux CI builds headless. `default-members` keeps bare `cargo build`/`test`/
# `clippy` to the toolkit-free crates; the GUI crates (nohrs-ui / nohrs-pages /
# nohrs-launcher / nohrs) are still workspace members and build with
# `--workspace`, `-p`, or on macOS. This mirrors the previous single-crate
# `default = []` / `gui` feature.
default-members = [
  "crates/nohrs-cli",
  "crates/nohrs-core",
  "crates/nohrs-models",
  "crates/nohrs-services",
  "crates/nohrs-store",
]

[workspace.package]
version      = "0.3.4"
edition      = "2024"
# Edition 2024 alone would allow 1.85, which is what this said while the real
# floor climbed past it. 1.95 is the release that stabilized `cfg_select!`, used
# by the libsqlite3-sys build script behind rusqlite; the declared graph asks for
# at most 1.89 (redb).
rust-version = "1.95"
license      = "MIT"
repository   = "https://github.com/CakeDev4k/prime-files"
homepage     = "https://github.com/CakeDev4k/prime-files"
authors      = ["nohrs contributors"]

[workspace.dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
clap_complete      = "4"
thiserror          = "2"
tracing            = "0.1"
# `json` renders the file sink as JSON Lines, which is what `noh log` and the
# aggregation behind `noh perf` read; the stderr sink stays human-readable.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender   = "0.2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
time               = { version = "0.3", features = ["formatting", "macros", "parsing"] }
# Benchmarks (testing.md §5). `html_reports` is criterion default; the plotting
# backend is left to gnuplot-or-plotters at runtime.
criterion          = "0.7"

[workspace.lints.rust]
unsafe_code  = "deny"
# Every public item must carry a doc comment (testing.md §3). Promoted to an
# error in CI by `-D warnings`; to be raised to "deny" in P7 (#48).
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# The release build is what `iniciar-nohrs.bat` runs day to day (debug scrolls
# too slowly through big folders), so it is tuned for rebuilding after an edit
# rather than for shipping: incremental keeps the unchanged parts of a crate,
# and more codegen units split the optimizer's work across the cores. The cost
# is a slightly slower binary, not visible in use. Dependencies keep the
# default and are built once.
#
# Size was measured and left for later: `opt-level = "s"` takes the binary from
# 39 MB to 29.6 MB, and the `dist` profile below from 39 MB to 23.5 MB with a
# full LTO. Both are written down in docs/size.md for when the binary's size is
# worth the slower runtime and build.
[profile.release]
incremental = true
codegen-units = 256

# What the installer ships (`cargo build --profile dist`): the release profile
# above is tuned for fast rebuilds while developing, this one for the program
# people run.
[profile.dist]
inherits = "release"
incremental = false
codegen-units = 16

# gpui 0.2.2 with one fix in its Windows drop target (third_party/gpui/NOHRS.md).
# Without it, dragging files out of Nohrs and over its own window crashes.
[patch.crates-io]
gpui = { path = "third_party/gpui" }
